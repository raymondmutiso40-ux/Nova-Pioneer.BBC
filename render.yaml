databases:
  - name: nova-pioneer-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: nova-pioneer
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push --accept-data-loss=false && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nova-pioneer-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
